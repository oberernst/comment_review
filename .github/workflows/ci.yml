name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - elixir: "1.14.3"
            otp: "25.2.3"
          - elixir: "1.18.3"
            otp: "26.2.5.11"
          - elixir: "1.20.3"
            otp: "29.0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix comments
